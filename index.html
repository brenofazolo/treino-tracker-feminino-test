<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Treino Tracker Feminino</title><style>:root{--bg:#f7f5f9;--card:#fff;--text:#211c26;--muted:#77707d;--line:#e8e2eb;--dark:#4c1d95;--accent:#7c3aed;--soft:#f0eafa;--green:#16803c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding-bottom:88px}header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:22px 17px 18px;border-radius:0 0 25px 25px;padding-top:calc(22px + env(safe-area-inset-top))}.brand{font-size:23px;font-weight:900}.sub{font-size:11px;opacity:.75;margin-top:3px}.week{display:flex;gap:5px;margin-top:17px}.day{flex:1;border:0;padding:7px 1px;border-radius:9px;background:#ffffff20;color:#fff;font-size:9px}.day.active{background:#fff;color:#4c1d95;font-weight:900}main{padding:15px}.tabs{display:flex;gap:5px;margin-bottom:13px}.tabs button{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px;font-weight:850}.tabs .sel{background:var(--dark);color:#fff}.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.muted{font-size:11px;color:var(--muted)}.badge{background:var(--soft);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:850}.bar{height:7px;background:#e7e3ea;border-radius:8px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0}.section{border-top:1px solid #eee9f0;padding:12px 0}.section:first-child{border-top:0;padding-top:0}.section-title{font-weight:900;font-size:13px}.exercise{border-top:1px solid #eee9f0;padding:14px 0}.exercise:first-child{border-top:0;padding-top:0}.name{font-weight:850;font-size:14px}.meta{font-size:10px;color:#777;margin-top:3px}.exrow,.row{display:flex;justify-content:space-between;gap:8px}.setbox{margin-top:9px;padding:9px;background:#faf9fb;border-radius:10px}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}.inputs label{font-size:9px;color:#777}.inputs input{width:100%;margin-top:3px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}.btn,.primary{border-radius:10px;padding:9px 11px;font-weight:800}.btn{border:1px solid #ddd;background:#fff}.done{background:var(--green);color:#fff;border-color:var(--green)}.primary{width:100%;border:0;background:var(--dark);color:#fff;font-size:14px}.intensity{background:#f7f5f9;border-radius:10px;padding:9px;margin-top:8px;font-size:10px;line-height:1.45}.note{padding:10px;background:#fff8e6;border-radius:10px;font-size:10px;line-height:1.5}.history{padding:11px 0;border-top:1px solid #eee}.history:first-child{border-top:0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#777;font-size:10px}nav .on{color:#4c1d95;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(500px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px}.clock{font-size:64px;font-weight:900;text-align:center}.update-banner{background:#eef6ff;border:1px solid #a8d1ff;border-radius:17px;padding:14px;margin:15px 0}.update-banner h3{margin:0 0 8px;font-size:16px}.update-banner button{width:100%;border:0;border-radius:10px;padding:11px;background:#4c1d95;color:#fff;font-weight:900}.update-status{font-weight:900}.update-ok{color:var(--green)}.update-warn{color:#b45309}</style></head><body><div class="app"><header><div class="brand">Treino Tracker Feminino</div><div class="sub" id="versionSub">V1.01 • 35 minutos • hipertrofia</div><div class="week" id="week"></div></header><main id="main"></main><nav><button class="on" onclick="show('treino')">🏋️<br>Treino</button><button onclick="show('historico')">📅<br>Histórico</button><button onclick="show('progresso')">📈<br>Progresso</button><button onclick="show('config')">⚙️<br>Config.</button></nav></div><div class="modal" id="modal"><div class="sheet"><div class="title">Descanso</div><div class="clock" id="clock">60</div><button class="primary" onclick="closeTimer()">Encerrar</button></div></div><script>const AVAILABLE_VERSION='1.02',INSTALLED_VERSION=localStorage.getItem('ttf_version')||'1.01';document.getElementById('versionSub').textContent=`V${INSTALLED_VERSION} • 35 minutos • hipertrofia`;const W={QUARTA:{title:'🍑 Glúteos + posteriores',time:35,items:[['Hip thrust','3x8–10','grande',90],['Stiff com halteres','3x8–10','grande',90],['Mesa flexora','3x10–12','pequeno',75],['Cadeira abdutora','2x15–20','pequeno',60],['Extensão de quadril no cabo','2x12–15 cada perna','pequeno',60]]},QUINTA:{title:'💪 Tríceps + costas + ombros',time:35,items:[['Puxada alta','3x8–10','grande',75],['Remada baixa','3x10–12','grande',75],['Desenvolvimento de ombros','2x8–10','grande',75],['Tríceps na polia com barra','3x10–12','pequeno',60],['Tríceps francês','2x10–12','pequeno',60],['Elevação lateral','2x12–15','pequeno',60]]},SEXTA:{title:'🍑 Glúteos + quadríceps',time:35,items:[['Agachamento no Smith','3x8–10','grande',90],['Leg press','3x10–12','grande',90],['Afundo/Búlgaro','2x8–10 cada perna','grande',75],['Cadeira extensora','2x12–15','pequeno',60],['Abdutora','2x15–20','pequeno',60]]},SÁBADO:{title:'💪 Tríceps + glúteos + core',time:35,items:[['Hip thrust','3x10–12','grande',90],['Passada no Smith ou halteres','2x10 cada perna','grande',75],['Coice no cabo','2x12–15 cada perna','pequeno',60],['Tríceps corda','3x10–12','pequeno',60],['Tríceps testa','2x10–12','pequeno',60],['Prancha','2x30–45 s','core',60]]},DOMINGO:{title:'💪 Upper Hipertrofia',time:35,items:[['Supino máquina','3x10–12','grande',75],['Remada baixa','3x10–12','grande',75],['Puxada alta','2x10–12','grande',75],['Elevação lateral','2x12–15','pequeno',60],['Tríceps corda','2x10–12','pequeno',60],['Rosca direta','2x10–12','pequeno',60]]}};let D=JSON.parse(localStorage.getItem('ttf100')||'{"sessions":{}}'),day=getDay(),timer=null;function save(){localStorage.ttf100=JSON.stringify(D)}function getDay(){return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()]}function key(){return new Date().toISOString().slice(0,10)+'_'+day}function S(){if(!D.sessions[key()])D.sessions[key()]={finished:false,ex:{}};return D.sessions[key()]}function count(x){let m=x.match(/^(\d+)/);return m?+m[1]:2}function ex(i){let s=S(),n=count(W[day].items[i][1]);if(!s.ex[i])s.ex[i]={sets:Array.from({length:n},()=>({done:false,reps:'',rpe:'',load:''}))};while(s.ex[i].sets.length<n)s.ex[i].sets.push({done:false,reps:'',rpe:'',load:''});return s.ex[i]}function week(){let d=new Date(),names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],h='';for(let n=-3;n<=3;n++){let x=new Date(d);x.setDate(d.getDate()+n);let f=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][x.getDay()];h+=`<button class="day ${n===0?'active':''}" onclick="day='${f}';render()">${names[x.getDay()]}<br>${x.getDate()}</button>`}document.getElementById('week').innerHTML=h}function render(){if(!W[day]){main.innerHTML='<div class="card"><div class="title">Descanso</div><div class="muted">Hoje não há treino programado.</div></div>';return}let w=W[day],total=w.items.reduce((a,e)=>a+count(e[1]),0),done=w.items.reduce((a,_,i)=>a+ex(i).sets.filter(s=>s.done).length,0),p=Math.round(done/total*100);main.innerHTML=`<div id="updateSlot"></div><div class="tabs">${Object.keys(W).map(k=>`<button class="${k===day?'sel':''}" onclick="day='${k}';render()">${W[k].title.split(' ').slice(0,2).join(' ')}</button>`).join('')}</div><div class="row"><div><div class="title">${w.title}</div><div class="muted">${w.time} min • ${done}/${total} séries</div></div><span class="badge">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="card"><div class="section"><div class="section-title">🔥 Estrutura</div><div class="muted" style="margin-top:5px">4 min aquecimento • 27–28 min musculação • 3–4 min finalização/core.</div></div><div class="section"><div class="section-title">🎯 Intensidade</div><div class="intensity">Série 1: <b>2 RIR</b> • Série 2: <b>1 RIR</b> • Série 3: <b>quase falha técnica</b>.</div></div><div class="section"><div class="section-title">⏱ Descanso</div><div class="muted" style="margin-top:5px">60–75 s na maioria; até 90 s nos exercícios pesados.</div></div></div><div class="card">${w.items.map((e,i)=>exercise(e,i)).join('')}</div><button class="primary" onclick="finish()">✓ Finalizar treino</button>`;renderUpdate()}function exercise(e,i){let s=ex(i),n=s.sets.length;return `<div class="exercise"><div class="exrow"><div><div class="name">${e[0]}</div><div class="meta">${e[1]} • ${e[2]} • descanso ${e[3]}s</div></div><span class="badge">${s.sets.filter(x=>x.done).length}/${n}</span></div>${s.sets.map((x,j)=>`<div class="setbox"><div class="row"><b style="font-size:11px">Série ${j+1}/${n}</b><span class="muted">${j===0?'2 RIR':j===1?'1 RIR':'quase falha'}</span></div><div class="inputs"><label>Reps<input type="number" value="${x.reps}" onchange="val(${i},${j},'reps',this.value)"></label><label>RPE<input type="number" value="${x.rpe}" onchange="val(${i},${j},'rpe',this.value)"></label><label>Carga<input value="${x.load}" placeholder="kg" onchange="val(${i},${j},'load',this.value)"></label></div><button class="btn ${x.done?'done':''}" style="width:100%;margin-top:7px" onclick="toggle(${i},${j})">${x.done?'✓ Série concluída':'Marcar série concluída'}</button></div>`).join('')}<button class="btn" style="margin-top:8px" onclick="start(${e[3]})">⏱ ${e[3]} s</button></div>`}function val(i,j,f,v){ex(i).sets[j][f]=v;save()}function toggle(i,j){ex(i).sets[j].done=!ex(i).sets[j].done;save();render()}function finish(){S().finished=true;S().finishedAt=new Date().toISOString();save();alert('Treino registrado!');render()}function start(sec){let end=Date.now()+sec*1000;modal.classList.add('show');function tick(){let n=Math.max(0,Math.ceil((end-Date.now())/1000));clock.textContent=n;if(n<=0){clearInterval(timer);if(navigator.vibrate)navigator.vibrate([200,100,200])}}clearInterval(timer);timer=setInterval(tick,250);tick();if('wakeLock'in navigator&&navigator.wakeLock.request){navigator.wakeLock.request('screen').catch(()=>{})}}function closeTimer(){clearInterval(timer);modal.classList.remove('show')}function history(){let a=Object.entries(D.sessions).filter(x=>x[1].finished).sort((a,b)=>b[1].finishedAt.localeCompare(a[1].finishedAt));main.innerHTML=`<div class="title">Histórico</div><div class="card">${a.length?a.map(([k,v])=>`<div class="history"><b>${k.split('_')[1]}</b><div class="muted">${new Date(k.split('_')[0]+'T12:00:00').toLocaleDateString('pt-BR')}</div></div>`).join(''):'Nenhum treino finalizado.'}</div>`}function progress(){let n=Object.values(D.sessions).filter(x=>x.finished).length;main.innerHTML=`<div class="title">Progresso</div><div class="card"><div class="title">${n}</div><div class="muted">treinos concluídos</div></div><div class="card"><b>Regra de progressão</b><div class="muted" style="margin-top:7px">Ao atingir o topo da faixa de repetições em todas as séries com técnica, aumente a carga na próxima sessão.</div></div>`}function config(){let status=INSTALLED_VERSION===AVAILABLE_VERSION?'<div class="update-status update-ok">✓ Aplicativo atualizado</div>':'<div class="update-status update-warn">⚠️ Atualização disponível</div>';main.innerHTML=`<div class="title">Configurações</div><div class="card"><b>Treino Tracker Feminino</b><div class="muted" style="margin-top:7px">Versão instalada: <b>V${INSTALLED_VERSION}</b></div><div style="margin-top:10px">${status}</div></div><div id="configUpdate"></div><div class="card"><b>Metas</b><div class="muted" style="line-height:1.7;margin-top:7px">Treinos: quarta a domingo<br>Tempo: 35 min<br>Descanso: 60–75 s; pesados até 90 s</div></div><div class="card"><b>Dados</b><div class="muted" style="margin-top:7px">Os registros ficam salvos localmente neste aparelho. Atualizações não apagam seu histórico.</div></div>`;renderUpdate(true)}function renderUpdate(configPage=false){if(INSTALLED_VERSION===AVAILABLE_VERSION)return;let html=`<div class="update-banner"><h3>🆕 Nova versão V${AVAILABLE_VERSION} disponível</h3><div class="muted" style="margin-bottom:10px">Atualize o Treino Tracker para continuar usando a versão mais recente.</div><button onclick="updateApp()">Atualizar agora</button></div>`;let slot=document.getElementById(configPage?'configUpdate':'updateSlot');if(slot)slot.innerHTML=html}function updateApp(){localStorage.setItem('ttf_version',AVAILABLE_VERSION);location.reload()}function show(s){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',['treino','historico','progresso','config'][i]===s));if(s==='treino'){week();render()}else if(s==='historico')history();else if(s==='progresso')progress();else config()}week();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
